name: Release Yingbao APK
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release asset
        run: |
          APK="$(find dist -maxdepth 1 -type f -name 'Yingbao-v*.apk' -printf '%f\n' | sort -V | tail -1)"
          test -n "$APK"
          cp "dist/$APK" Yingbao.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Yingbao.apk --title "莹宝 ${GITHUB_REF_NAME}" --notes "莹宝 Android 2.0。点击 Assets 下的 Yingbao.apk 直接下载。"
