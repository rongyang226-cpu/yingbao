name: Package Yingbao APK
on:
  push:
    branches: [main]
    paths:
      - "dist/Yingbao-v2.0.0.apk"
      - ".github/workflows/package-apk.yml"
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yingbao-v2.0.0
          path: dist/Yingbao-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30
