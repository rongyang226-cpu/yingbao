<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f3f5fb"><title>萤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--ink:#4b3943;--muted:#9a7e8a;--glass:rgba(255,255,255,.76);--line:rgba(214,142,166,.16);--pink:#ef7fa4;--pink2:#f6adc2}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff1f5}.stage{position:fixed;inset:0;background:radial-gradient(circle at 76% 12%,#fff 0 7%,#ffe9f0 22%,transparent 45%),linear-gradient(165deg,#fff9fb 0%,#fbeef3 52%,#f5e3ea 100%);overflow:hidden}.topbar{position:absolute;z-index:6;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.identity{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:#ef86a8;box-shadow:0 0 0 5px #fff9}.name{font-weight:750;font-size:18px}.sub{font-size:11px;color:var(--muted);margin-top:1px}.status{padding:8px 11px;border-radius:999px;background:var(--glass);border:1px solid #fff;box-shadow:0 8px 28px #6272941b;font-size:11px;color:#9b7181}.timeWeather{position:absolute;z-index:6;top:calc(max(16px,env(safe-area-inset-top)) + 48px);left:18px;right:18px;display:flex;gap:7px;pointer-events:none}.timeWeather span{padding:7px 10px;border-radius:13px;background:rgba(255,255,255,.83);box-shadow:0 5px 20px #62729419;font-size:11px;color:#765866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timeWeather span:last-child{flex:1}.avatarWrap{position:absolute;z-index:2;inset:70px 0 116px;display:flex;align-items:center;justify-content:center;pointer-events:none}.avatar{width:min(78vw,440px);height:100%;max-height:720px;position:relative;background:url('/assets/yingbao_model_clean.png') center bottom/contain no-repeat;touch-action:none;pointer-events:auto;transform-origin:50% 70%;will-change:transform;}.avatar.pokeA{animation:pokeA .5s cubic-bezier(.2,.9,.25,1)}.avatar.pokeB{animation:pokeB .8s cubic-bezier(.2,.9,.25,1)}@keyframes pokeA{0%{transform:scale(1)}25%{transform:scale(.955)}55%{transform:scale(1.055)}100%{transform:scale(1)}}@keyframes pokeB{0%{transform:scale(1)}18%{transform:scale(.965)}45%{transform:scale(1.065)}72%{transform:scale(.988)}100%{transform:scale(1)}}.stateHud{display:flex;position:absolute;z-index:7;right:14px;top:calc(max(16px,env(safe-area-inset-top)) + 97px);width:108px;flex-direction:column;gap:5px;pointer-events:none}.stateChip{padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.80);border:1px solid rgba(239,127,164,.16);box-shadow:0 7px 22px #a66c8014;font-size:11px;color:#765866}.stateChip b{display:block;font-size:12px;color:#4b3943;margin-bottom:2px}.speech{position:absolute;z-index:8;top:15%;left:52%;max-width:min(66vw,290px);padding:10px 14px;border-radius:18px 18px 18px 6px;background:#fff;color:#5b4650;border:1px solid rgba(239,127,164,.20);box-shadow:0 12px 36px #68789d28;font-size:14px;opacity:0;transform:translateY(7px) scale(.97);transition:.2s;pointer-events:none}.speech.show{opacity:1;transform:none}.dock{position:absolute;z-index:9;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));height:86px;padding:8px 7px;border:1px solid #fff;border-radius:28px;background:rgba(255,250,252,.88);box-shadow:0 16px 48px #58698924;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.nav{border:0;background:transparent;border-radius:21px;color:#a47b8b;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav b{font-size:20px;font-weight:500}.nav.primary{background:#ffe1ea;color:#df6d93}.nav:active{transform:scale(.94)}.panel{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:74%;padding:14px 16px calc(18px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:rgba(255,249,251,.985);box-shadow:0 -18px 60px #59698735;transform:translateY(105%);transition:.28s;overflow:auto}.panel.open{transform:none}.handle{width:38px;height:4px;border-radius:4px;background:#ccd3e0;margin:0 auto 13px}.panel h2{font-size:20px;margin:0 0 4px}.lead{font-size:12px;color:var(--muted);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:13px;border-radius:18px;border:1px solid var(--line);background:#fff;text-align:left;color:#4b566e}.choice strong{display:block;font-size:14px;margin-bottom:3px}.choiceThumb{width:100%;height:92px;object-fit:contain;display:block;margin:-4px 0 8px;border-radius:14px;background:#fff7fa}.choice span{font-size:11px;color:#8b94a7}.choice.on{border-color:#ee91ae;background:#fff0f5}.sizeBox{margin-top:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px}.sizeBox label{display:flex;justify-content:space-between;font-size:13px}.sizeBox input{width:100%;margin-top:12px}.chat{position:fixed;z-index:30;inset:0;background:linear-gradient(180deg,#fff8fa,#f8e9ef);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}.chat.open{display:flex}.chatHead{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#ffffffc8}.close{border:0;background:#e9edf5;color:#59647b;border-radius:18px;padding:8px 14px}.messages{flex:1;overflow:auto;padding:18px 14px 24px}.msg{max-width:82%;padding:11px 14px;border-radius:19px;margin:8px 0;white-space:pre-wrap;line-height:1.45;font-size:15px}.me{margin-left:auto;background:#ef7fa4;color:#fff}.ying{margin-right:auto;background:#fff;color:#374157}.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#ffffffd9}.composer textarea{flex:1;resize:none;min-height:44px;border:1px solid #dfe4ee;background:#f7f9fc;color:#35405a;border-radius:20px;padding:11px 14px;outline:none;font-size:16px}.send{width:60px;border:0;border-radius:20px;background:#ef7fa4;color:#fff;font-weight:700}.wait{opacity:.55}
.avatar{--pose-angle:0deg;--pose-x:0px;animation:idleSway 6.8s ease-in-out infinite;backface-visibility:hidden}.avatar.pose-lean{--pose-angle:-1.6deg;--pose-x:-3px}.avatar.pose-tilt{--pose-angle:1.7deg;--pose-x:0px}@keyframes idleSway{0%,100%{transform:translateX(var(--pose-x)) rotate(var(--pose-angle)) scale(1)}45%{transform:translateX(calc(var(--pose-x) + 1px)) translateY(-2px) rotate(calc(var(--pose-angle) + .4deg)) scale(1.003)}75%{transform:translateX(calc(var(--pose-x) - 1px)) rotate(calc(var(--pose-angle) - .2deg)) scale(1.001)}}.avatar .artLayer{position:absolute;inset:auto;bottom:0;left:50%;width:var(--art-w,100%);height:var(--art-h,100%);translate:-50% 0;background-position:center;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none;will-change:transform;opacity:.57}.avatar .hairLeft{clip-path:polygon(0 14%,33% 14%,35% 40%,30% 54%,0 59%);animation:strandOne 5.3s ease-in-out infinite alternate}.avatar .hairRight{clip-path:polygon(68% 14%,100% 14%,100% 59%,70% 53%,65% 39%);animation:strandTwo 6.1s ease-in-out -2s infinite alternate}.avatar .hairTipLeft{clip-path:polygon(0 39%,30% 39%,35% 65%,0 69%);animation:strandTwo 4.8s ease-in-out -1s infinite alternate}.avatar .hairTipRight{clip-path:polygon(70% 39%,100% 39%,100% 69%,65% 65%);animation:strandOne 5.7s ease-in-out -3s infinite alternate}.avatar .skirtLeft{clip-path:polygon(0 55%,35% 55%,42% 100%,0 100%);animation:hemDrift 5.4s ease-in-out infinite alternate}.avatar .skirtRight{clip-path:polygon(65% 55%,100% 55%,100% 100%,58% 100%);animation:hemDrift 6s ease-in-out -2s infinite alternate-reverse}@keyframes strandOne{from{transform:translateX(-1px) rotate(-.2deg)}to{transform:translateX(1.4px) rotate(.22deg)}}@keyframes strandTwo{from{transform:translateX(1px) rotate(.18deg)}to{transform:translateX(-1.4px) rotate(-.18deg)}}@keyframes hemDrift{from{transform:translateX(-1px) rotate(-.15deg)}to{transform:translateX(2px) rotate(.24deg)}} .avatar.touch-hair .hairLeft,.avatar.touch-hair .hairRight,.avatar.touch-hair .hairTipLeft,.avatar.touch-hair .hairTipRight{animation-duration:.8s}.avatar.touch-skirt .skirtLeft,.avatar.touch-skirt .skirtRight{animation-duration:.9s}@media(prefers-reduced-motion:reduce){.avatar,.avatar .artLayer{animation:none!important}}\n</style></head><body>
<main class="stage"><div class="topbar"><div class="identity"><i class="dot"></i><div><div class="name">萤</div><div id="lifeText" class="sub">正在同步生活状态</div></div></div><div id="conn" class="status">连接中…</div></div><div class="timeWeather"><span id="clockText">正在读取时间…</span><span id="weatherText">设置城市以显示天气</span></div><div id="speech" class="speech"></div><div id="stateHud" class="stateHud"><div class="stateChip"><b id="hudActivity">同步中</b>正在做</div><div class="stateChip"><b id="hudMood">—</b>心情</div><div class="stateChip"><b id="hudEnergy">—</b>精力</div><div class="stateChip"><b id="hudPlace">—</b>位置</div></div><div class="avatarWrap"><div id="avatar" class="avatar"><i class="artLayer hairLeft"></i><i class="artLayer hairRight"></i><i class="artLayer hairTipLeft"></i><i class="artLayer hairTipRight"></i><i class="artLayer skirtLeft"></i><i class="artLayer skirtRight"></i></div></div><nav class="dock"><button id="chatBtn" class="nav primary"><b>◌</b>聊天</button><button id="diaryBtn" class="nav"><b>▤</b>日记</button><button id="settingsBtn" class="nav"><b>⚙</b>设置</button></nav></main>
<div id="panelShade" style="display:none;position:fixed;z-index:19;inset:0;background:#4b394322"></div><section id="panel" class="panel"><button id="panelClose" class="close" style="float:right">关闭</button><div class="handle"></div><h2 id="panelTitle"></h2><div id="panelLead" class="lead"></div><div id="panelBody"></div></section>
<section id="chat" class="chat"><div class="chatHead"><b>萤 · 私聊</b><button id="close" class="close">返回</button></div><div id="messages" class="messages"></div><div class="composer"><textarea id="input" rows="1" placeholder="和萤说点什么…"></textarea><button id="send" class="send">发送</button></div></section>
<script>
const $=id=>document.getElementById(id);
const REACTIONS={"head":["头顶被你碰到了。","轻一点嘛。","嗯？摸摸头？","今天的头发还整齐吗？","突然靠这么近。","我有在听。","不许揉乱刘海。","再摸一下也可以。","你在数发卡吗？","唔，发现你了。","头顶暖暖的。","这算打招呼吗？","我抬头看你了。","你又来摸头。","偷偷点我头顶？","怎么啦，想聊天？","好啦，我知道你在。","嗯哼，收到。","别把我当按钮呀。","我轻轻点头啦。","你摸一下，我就不躲啦。","就这一次哦……再来一次也行。","你手放在这里，我会乖一点。","哼，知道你想摸头了。","再揉就靠过去了哦。","你这样叫我，我当然会看你。","摸完头要陪我一会儿。","我才没有在等这一下。","可以再轻一点点吗？","好啦，脑袋借你放手。"],"hair":["头发会被弄乱的。","风刚吹过这里。","你看到发梢了吗？","长发有点难打理。","小心缠到手指。","这缕发丝不听话。","你在帮我梳头吗？","轻轻碰就好。","发尾好像在飘。","黑发里藏着光呢。","别拉我的头发啦。","今天披着头发。","你摸到的是发梢。","风把头发吹向你了。","我来理一理。","发丝痒痒的。","你觉得这个发型怎样？","等一下，我把它拨开。","好啦，顺了。","这是我的长头发呀。","别急，我把这缕头发分给你看。","发尾绕着你转，好烦……才不烦。","帮我把乱掉的那缕拨回去嘛。","你摸得这么轻，我就不说你了。","头发被你碰过，就先不扎起来。","等我一下，发梢还勾着你的手。","你要是喜欢，我就这样披着。","我才没特意把头发留给你摸。","风停了，你再帮我理一下？","别笑，我只是想靠近一点。"],"hand":["要牵手吗？","手心有点暖。","你碰到我的手了。","先别急，我在。","嗯，把手给我。","手指轻轻动了一下。","你是在叫我吗？","我握一下就松开。","碰到了哦。","今天也一起待着吧。","别偷偷戳我的手。","我听见你了。","这边是我的手呀。","你手好暖。","再打个招呼？","嗯，我回应你。","轻轻握住就好。","小手也会怕痒。","让我看看你在做什么。","我就在这里。","牵一下就好……别马上松。","手伸过来嘛，我又不会躲。","嗯，我抓住你衣角了。","再握一会儿，可以吗？","你先伸手，我才没有主动。","手心有点凉，借我暖暖。","等一下，我还没握够。","你碰到我，我就安心一点。","把手给我，我跟着你。","哼，牵好了就别乱跑。"],"skirt":["裙摆要飘起来了。","这层薄纱很轻。","别踩到裙边哦。","你在看裙子的褶吗？","裙角刚晃了一下。","轻一点，纱会皱。","风吹起了裙摆。","这一层像小云朵。","裙边擦过你的手。","我提一下裙摆。","白色的纱好看吗？","裙摆在轻轻摇。","你摸到外层薄纱了。","下摆有很多层呢。","慢一点，别扯到。","刚才裙角动了。","像被风碰了一下。","要看看裙子的纹路吗？","我把裙边理好了。","你又盯着裙摆看。","帮我按住裙角，好不好？","裙摆飘起来了，你看到了吗？","你在旁边，我就不怕风大。","别扯啦，我会自己靠近你。","你喜欢的话，我转半圈给你看。","这边的薄纱，轻轻摸就好。","风把裙边送到你手边了。","我才不是特意提着裙子给你看。","看完裙摆，也看看我嘛。","帮我整理一下，我想站得好看些。"],"feet":["鞋尖碰到你啦。","小心别踩到我。","我往旁边挪一步。","脚步轻轻的。","这双鞋有点亮。","你在看鞋带吗？","站稳啦。","鞋跟轻轻点地。","我还在这里。","要一起散步吗？","脚边有风。","再往前走一步？","这边是鞋尖。","我换个重心。","别挠脚边，好痒。","裙摆快碰到鞋了。","我轻轻踏了一下。","鞋带好好系着呢。","你在叫我走过去吗？","慢慢走就好。","慢点走，我要跟上你。","你走前面，我踩着你的影子。","鞋尖碰到啦，算我先打招呼。","站久了，陪我挪两步嘛。","再靠近一点，我就不往后退。","要散步的话，记得牵我。","我走得慢，你等等我。","鞋带没松，是我想你停一下。","你停在哪儿，我就在旁边。","哼，走之前先叫上我。"]};
function touchZone(x,y){if(y<.24&&x>.32&&x<.68)return 'head';if(y<.59&&(x<.34||x>.68))return 'hair';if(y<.55)return 'hand';if(y>.88&&x>.38&&x<.62)return 'feet';return 'skirt'}
const POSES=[["stand","自然站立"],["lean","轻轻侧身"],["tilt","歪头看你"]];
const CLOTHES=[["moon","月白冰蓝薄纱裙"],["knit","奶白针织连衣裙"],["blue","浅蓝百褶裙"],["black","黑色简约连衣裙"],["sleep","浅色薄款睡裙"]];
let prefs=JSON.parse(localStorage.getItem("ying22")||"{}");if(!prefs.pose)prefs.pose="stand";if(!prefs.cloth)prefs.cloth="moon";if(!prefs.size)prefs.size=100;if(prefs.hd===undefined)prefs.hd=true;let weatherCity=JSON.parse(localStorage.getItem("yingWeatherCity")||"null");let clockZone=localStorage.getItem("yingClockZone")||"device";
let holdTimer=null,startX=0,startY=0,moved=false,longOpened=false,hideBubbleTimer=null,lastState=null;
function savePrefs(){localStorage.setItem("ying22",JSON.stringify(prefs));applySize();applyCharacterAsset()}
function applySize(){$("avatar").style.width="min("+Math.round(78*prefs.size/100)+"vw,"+Math.round(440*prefs.size/100)+"px)";requestAnimationFrame(updateArtworkBounds)}
function artworkBounds(){const a=$("avatar"),box=a.getBoundingClientRect(),width=Math.min(box.width,box.height*2/3),height=width*1.5;return {left:box.left+(box.width-width)/2,top:box.bottom-height,width,height}}
function updateArtworkBounds(){const a=$("avatar"),width=Math.min(a.clientWidth,a.clientHeight*2/3);a.style.setProperty('--art-w',width+'px');a.style.setProperty('--art-h',width*1.5+'px')}
if(window.ResizeObserver)new ResizeObserver(updateArtworkBounds).observe($("avatar"));else window.addEventListener("resize",updateArtworkBounds);

let assetTicket=0;
function applyCharacterAsset(){
 const target=prefs.hd?"/assets/yingbao_model_hd.webp":"/assets/yingbao_model_clean.png";
 $("avatar").style.backgroundImage="url('"+target+"')";
 $("avatar").querySelectorAll('.artLayer').forEach(el=>el.style.backgroundImage="url('"+target+"')");
 $("avatar").classList.remove('pose-lean','pose-tilt');
 if(prefs.pose==='lean'||prefs.pose==='tilt')$("avatar").classList.add('pose-'+prefs.pose);
}
async function syncAppearance(patch){
 try{
  const r=await fetch("/api/mobile/appearance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
  if(r.ok){const j=await r.json();prefs.pose=j.pose;prefs.cloth=j.outfit;prefs.size=j.scale;localStorage.setItem("ying22",JSON.stringify(prefs));applySize();applyCharacterAsset();if(window.YingbaoNative&&YingbaoNative.refreshOverlayAppearance)YingbaoNative.refreshOverlayAppearance()}
 }catch(_){}
}
async function loadAppearance(){
 try{const r=await fetch("/api/mobile/appearance");if(r.ok){const j=await r.json();prefs.pose=j.pose;prefs.cloth=j.outfit;prefs.size=j.scale;localStorage.setItem("ying22",JSON.stringify(prefs));applySize();applyCharacterAsset();if(window.YingbaoNative&&YingbaoNative.refreshOverlayAppearance)YingbaoNative.refreshOverlayAppearance()}}catch(_){}
}
function showBubble(t,ms=2600){if(!t)return;let e=$("speech");e.textContent=t;e.classList.add("show");clearTimeout(hideBubbleTimer);hideBubbleTimer=setTimeout(()=>e.classList.remove("show"),ms)}
function bounce(){let a=$("avatar"),c=Math.random()<.5?"pokeA":"pokeB";a.classList.remove("pokeA","pokeB");void a.offsetWidth;a.classList.add(c);setTimeout(()=>a.classList.remove(c),850)}
function localPoke(e){const box=artworkBounds();if(e.clientX<box.left||e.clientX>box.left+box.width||e.clientY<box.top||e.clientY>box.top+box.height)return;bounce();const zone=touchZone((e.clientX-box.left)/box.width,(e.clientY-box.top)/box.height);const lines=REACTIONS[zone];const avatar=$("avatar");avatar.classList.remove('touch-hair','touch-skirt');if(zone==='hair'||zone==='skirt')avatar.classList.add('touch-'+zone);clearTimeout(window.__touchMotion);window.__touchMotion=setTimeout(()=>avatar.classList.remove('touch-hair','touch-skirt'),1250);showBubble(lines[Math.floor(Math.random()*lines.length)])}
function openChat(){longOpened=true;$("panel").classList.remove("open");$("chat").classList.add("open");setTimeout(()=>$("input").focus(),120)}
function clearHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null}}
$("avatar").addEventListener("pointerdown",e=>{moved=false;longOpened=false;startX=e.clientX;startY=e.clientY;clearHold();holdTimer=setTimeout(openChat,800)});
$("avatar").addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>16){moved=true;clearHold()}});
$("avatar").addEventListener("pointercancel",()=>{moved=true;clearHold()});

function closePanel(){$("panel").classList.remove("open");$("panelShade").style.display="none"} function openPanel(type){let p=$("panel"),body=$("panelBody");$("panelShade").style.display="block";body.innerHTML="";if(type==="pose"){$("panelTitle").textContent="动作";$("panelLead").textContent="轻微姿态由你手动选择，保持同一张人物立绘。";let g=document.createElement("div");g.className="grid";POSES.forEach(x=>{let k=x[0],n=x[1],b=document.createElement("button");b.className="choice "+(prefs.pose===k?"on":"");b.innerHTML="<img class='choiceThumb' src='/assets/yingbao_model_hd.webp'><strong>"+n+"</strong><span>"+(prefs.pose===k?"当前动作":"点击切换")+"</span>";b.onclick=()=>{prefs.pose=k;savePrefs();syncAppearance({pose:k});openPanel("pose")};g.appendChild(b)});body.appendChild(g)}

function addMsg(t,w,wait=false){let d=document.createElement("div");d.className="msg "+w+(wait?" wait":"");d.textContent=t;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}
async function send(){let t=$("input").value.trim();if(!t)return;$("input").value="";addMsg(t,"me");let w=addMsg("正在想…","ying",true);$("send").disabled=true;try{let r=await fetch("/api/mobile/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})}),j=await r.json();w.textContent=j.reply||"刚刚卡了一下…";w.classList.remove("wait")}catch(_){w.textContent="连接断了一下，我重新连。";w.classList.remove("wait")}finally{$("send").disabled=false}}
$("send").onclick=send;$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function zhActivity(v){let m={shopping:"逛街",idle:"休息",resting:"休息",sleeping:"睡觉",eating:"吃东西",cooking:"做饭",gaming:"玩游戏",reading:"看书",watching:"看东西",walking:"散步",working:"忙事情",chatting:"聊天",cleaning:"收拾房间",showering:"洗澡"};return m[v]||"陪着你"}
function zhMood(v){let m={neutral:"平静",happy:"开心",calm:"平静",sad:"难过",angry:"生气",tired:"困倦",sleepy:"困了",excited:"兴奋",shy:"害羞",upset:"不开心"};return m[v]||"平静"}
function zhPlace(v){let m={nearby_store:"附近商店",home:"家里",bedroom:"卧室",living_room:"客厅",kitchen:"厨房",outside:"外面",store:"商店"};return m[v]||"家里"}
function apply(s){lastState=s;let act=zhActivity(s.life?.activity),sleep=s.life?.sleep_state==="sleeping";$("lifeText").textContent=(sleep?"睡着了":"醒着")+" · "+act;$("avatar").style.opacity=sleep?".88":"1";$("hudActivity").textContent=act;$("hudMood").textContent=zhMood(s.emotion?.mood);let e=s.life?.energy;$("hudEnergy").textContent=e==null?"—":Math.round(Number(e)*100)+"%";$("hudPlace").textContent=zhPlace(s.world?.place)}
function updateClock(){
 const now=new Date(),tz=clockZone==="device"?undefined:clockZone;
 try{
  const fmt=new Intl.DateTimeFormat("zh-CN",{timeZone:tz,month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false});
  let zoneName=clockZone==="device"?"手机时区":clockZone==="Asia/Shanghai"?"北京时间":"东京时间";
  $("clockText").textContent=fmt.format(now)+" · "+zoneName;
 }catch(_){$("clockText").textContent=now.toLocaleString("zh-CN")}
}
function weatherName(code){
 if(code===0)return"晴";if(code<=3)return"多云";if(code<=48)return"雾";
 if(code<=57)return"毛毛雨";if(code<=67)return"雨";if(code<=77)return"雪";
 if(code<=82)return"阵雨";if(code<=86)return"阵雪";if(code<=99)return"雷雨";return"天气";
}
async function updateWeather(){
 if(!weatherCity){$("weatherText").textContent="设置城市以显示天气";return}
 $("weatherText").textContent=weatherCity.name+" · 正在更新天气…";
 try{
  const q=new URLSearchParams({lat:weatherCity.latitude,lon:weatherCity.longitude,tz:weatherCity.timezone||"auto"});
  const r=await fetch("/api/mobile/weather?"+q,{cache:"no-store"});
  if(!r.ok)throw Error("weather");
  const w=await r.json(),temp=Number(w.temperature);
  if(!Number.isFinite(temp))throw Error("temperature");
  $("weatherText").textContent=weatherCity.name+" · "+weatherName(w.weather_code)+" "+Math.round(temp)+"°C";
 }catch(_){$("weatherText").textContent=weatherCity.name+" · 天气暂时不可用"}
}

function setupWeatherSettings(){
 const box=document.createElement("div");box.className="sizeBox";
 box.innerHTML='<label><span>页面时间</span></label><select id="clockSelect" style="width:100%;padding:12px;margin-top:8px;border-radius:12px"><option value="device">跟随手机时区</option><option value="Asia/Shanghai">北京时间</option><option value="Asia/Tokyo">东京时间</option></select><label style="margin-top:14px"><span>天气城市</span></label><input id="cityQuery" placeholder="输入城市，如郑州或东京" style="width:100%;padding:12px;margin-top:8px;border:1px solid #dde0e8;border-radius:12px"><button id="citySearch" class="close" style="margin-top:8px">查找城市</button><div id="cityResults" style="margin-top:8px"></div><p id="citySelected" style="font-size:12px;color:#8b7180"></p>';
 $("panelBody").appendChild(box);
 const select=$("clockSelect");select.value=clockZone;
 select.onchange=()=>{clockZone=select.value;localStorage.setItem("yingClockZone",clockZone);updateClock()};
 $("citySelected").textContent=weatherCity?"当前："+weatherCity.name+" · "+(weatherCity.region||weatherCity.country||""):"选择一次城市，之后会记住";
 $("citySearch").onclick=async()=>{
  let q=$("cityQuery").value.trim(),results=$("cityResults");results.textContent="正在查找…";
  if(q.length<2){results.textContent="请输入至少两个字";return}
  try{
   const r=await fetch("/api/mobile/weather/search?q="+encodeURIComponent(q));
   if(!r.ok)throw Error("search");const j=await r.json();results.textContent="";
   if(!j.results?.length){results.textContent="没有找到城市";return}
   j.results.forEach(city=>{
    const b=document.createElement("button");b.className="choice";b.style.width="100%";
    b.style.marginBottom="6px";b.textContent=[city.name,city.region,city.country].filter(Boolean).join(" · ");
    b.onclick=()=>{weatherCity=city;localStorage.setItem("yingWeatherCity",JSON.stringify(city));$("citySelected").textContent="当前："+b.textContent;results.textContent="";updateWeather()};
    results.appendChild(b);
   });
  }catch(_){results.textContent="暂时查不到，稍后再试"}
 };
}
let reconnects=0;function connect(){let p=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(p+"://"+location.host+"/ws");ws.onopen=()=>{reconnects=0;$("conn").textContent="在线"};ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(_){}};ws.onclose=async()=>{reconnects++;if(reconnects>=2){try{let r=await fetch("/api/mobile/whoami",{cache:"no-store"});if(r.status===401){$("conn").textContent="登录失效";location.reload();return}}catch(_){}}$("conn").textContent="重连中";setTimeout(connect,Math.min(8000,1200*reconnects))};ws.onerror=()=>ws.close()}
