async function openDiary(){
 let p=$("panel"),body=$("panelBody");$("panelShade").style.display="block";$("panelTitle").textContent="萤的日记";$("panelLead").textContent="今天的生活记录 · 只显示日记正文";body.innerHTML='<div class="sizeBox" style="line-height:1.75;white-space:pre-wrap">正在读取今天的日记…</div>';p.classList.add("open");
 try{let r=await fetch("/api/mobile/diary"),j=await r.json();body.innerHTML='<div class="sizeBox" style="line-height:1.75;white-space:pre-wrap"></div>';body.firstChild.textContent=j.text||"今天的正式日记还没有写。"}catch(_){body.innerHTML='<div class="sizeBox">日记暂时读取失败。</div>'}
}
$("panelClose").onclick=closePanel;$("panelShade").onclick=closePanel;$("chatBtn").onclick=openChat;$("diaryBtn").onclick=openDiary;$("gamesBtn").onclick=openGames;$("settingsBtn").onclick=()=>openPanel("settings");$("chatHelp").onclick=()=>{$("input").value="/help";send()};$("close").onclick=()=>{$("chat").classList.remove("open");$("input").blur()};
function addMsg(t,w,wait=false){let d=document.createElement("div");d.className="msg "+w+(wait?" wait":"");d.textContent=t;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}
async function send(){let t=$("input").value.trim();if(!t)return;$("input").value="";addMsg(t,"me");let w=addMsg("正在想…","ying",true);$("send").disabled=true;try{let r=await fetch("/api/mobile/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})}),j=await r.json();if(j.reset){$("messages").textContent="";w=addMsg("", "ying")}w.textContent=j.reply||"刚刚卡了一下…";w.classList.remove("wait")}catch(_){w.textContent="连接断了一下，我重新连。";w.classList.remove("wait")}finally{$("send").disabled=false}}
$("send").onclick=send;$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function zhActivity(v){let m={shopping:"逛街",idle:"休息",resting:"休息",sleeping:"睡觉",eating:"吃东西",cooking:"做饭",gaming:"玩游戏",reading:"看书",watching:"看东西",walking:"散步",working:"忙事情",chatting:"聊天",cleaning:"收拾房间",showering:"洗澡"};return m[v]||"陪着你"}
function zhMood(v){let m={neutral:"平静",happy:"开心",calm:"平静",sad:"难过",angry:"生气",tired:"困倦",sleepy:"困了",excited:"兴奋",shy:"害羞",upset:"不开心"};return m[v]||"平静"}
function zhPlace(v){let m={nearby_store:"附近商店",home:"家里",bedroom:"卧室",living_room:"客厅",kitchen:"厨房",outside:"外面",store:"商店"};return m[v]||"家里"}
function apply(s){lastState=s;let act=zhActivity(s.life?.activity),sleep=s.life?.sleep_state==="sleeping";$("lifeText").textContent=(sleep?"睡着了":"醒着")+" · "+act;$("avatar").style.opacity=sleep?".88":"1";$("hudActivity").textContent=act;$("hudMood").textContent=zhMood(s.emotion?.mood);let e=s.life?.energy;$("hudEnergy").textContent=e==null?"—":Math.round(Number(e)*100)+"%";$("hudPlace").textContent=zhPlace(s.world?.place)}
function updateClock(){
 const now=new Date(),tz=clockZone==="device"?undefined:clockZone;
 try{
  const fmt=new Intl.DateTimeFormat("zh-CN",{timeZone:tz,month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false});
  let zoneName=clockZone==="device"?"手机时区":clockZone==="Asia/Shanghai"?"北京时间":"东京时间";
  $("clockText").textContent=fmt.format(now)+" · "+zoneName;
 }catch(_){$("clockText").textContent=now.toLocaleString("zh-CN")}
}
function weatherName(code){
 if(code===0)return"晴";if(code<=3)return"多云";if(code<=48)return"雾";
 if(code<=57)return"毛毛雨";if(code<=67)return"雨";if(code<=77)return"雪";
 if(code<=82)return"阵雨";if(code<=86)return"阵雪";if(code<=99)return"雷雨";return"天气";
}
async function updateWeather(){
 if(!weatherCity){$("weatherText").textContent="设置城市以显示天气";return}
 $("weatherText").textContent=weatherCity.name+" · 正在更新天气…";
 try{
  const q=new URLSearchParams({lat:weatherCity.latitude,lon:weatherCity.longitude,tz:weatherCity.timezone||"auto"});
  const r=await fetch("/api/mobile/weather?"+q,{cache:"no-store"});
  if(!r.ok)throw Error("weather");
  const w=await r.json(),temp=Number(w.temperature);
  if(!Number.isFinite(temp))throw Error("temperature");
  $("weatherText").textContent=weatherCity.name+" · "+weatherName(w.weather_code)+" "+Math.round(temp)+"°C";
 }catch(_){$("weatherText").textContent=weatherCity.name+" · 天气暂时不可用"}
}
function setupArtSettings(){
 const box=document.createElement("div");box.className="sizeBox";
 box.innerHTML='<label><span>桌面宠物立绘</span></label><button id="hdArt" class="choice" style="width:100%;margin-top:9px"><strong>高清重绘</strong><span>默认，清晰透明边缘</span></button><button id="originalArt" class="choice" style="width:100%;margin-top:7px"><strong>原始立绘</strong><span>保留原图，可随时切回</span></button><p style="font-size:11px;color:#9a7e8a">这是同一造型的清晰重绘，五官和裙摆会有细微区别。</p>';
 $("panelBody").appendChild(box);
 const setArt=hd=>{
  prefs.hd=hd;savePrefs();
  $("hdArt").classList.toggle("on",hd);$("originalArt").classList.toggle("on",!hd);
  if(window.YingbaoNative&&YingbaoNative.setPetArt)YingbaoNative.setPetArt(hd);
 };
 $("hdArt").onclick=()=>setArt(true);$("originalArt").onclick=()=>setArt(false);
 $("hdArt").classList.toggle("on",prefs.hd);$("originalArt").classList.toggle("on",!prefs.hd);
}
function setupWeatherSettings(){
 const box=document.createElement("div");box.className="sizeBox";
 box.innerHTML='<label><span>页面时间</span></label><select id="clockSelect" style="width:100%;padding:12px;margin-top:8px;border-radius:12px"><option value="device">跟随手机时区</option><option value="Asia/Shanghai">北京时间</option><option value="Asia/Tokyo">东京时间</option></select><label style="margin-top:14px"><span>天气城市</span></label><input id="cityQuery" placeholder="输入城市，如郑州或东京" style="width:100%;padding:12px;margin-top:8px;border:1px solid #dde0e8;border-radius:12px"><button id="citySearch" class="close" style="margin-top:8px">查找城市</button><div id="cityResults" style="margin-top:8px"></div><p id="citySelected" style="font-size:12px;color:#8b7180"></p>';
 $("panelBody").appendChild(box);
 const select=$("clockSelect");select.value=clockZone;
 select.onchange=()=>{clockZone=select.value;localStorage.setItem("yingClockZone",clockZone);updateClock()};
 $("citySelected").textContent=weatherCity?"当前："+weatherCity.name+" · "+(weatherCity.region||weatherCity.country||""):"选择一次城市，之后会记住";
 $("citySearch").onclick=async()=>{
  let q=$("cityQuery").value.trim(),results=$("cityResults");results.textContent="正在查找…";
  if(q.length<2){results.textContent="请输入至少两个字";return}
  try{
   const r=await fetch("/api/mobile/weather/search?q="+encodeURIComponent(q));
   if(!r.ok)throw Error("search");const j=await r.json();results.textContent="";
   if(!j.results?.length){results.textContent="没有找到城市";return}
   j.results.forEach(city=>{
    const b=document.createElement("button");b.className="choice";b.style.width="100%";
    b.style.marginBottom="6px";b.textContent=[city.name,city.region,city.country].filter(Boolean).join(" · ");
    b.onclick=()=>{weatherCity=city;localStorage.setItem("yingWeatherCity",JSON.stringify(city));$("citySelected").textContent="当前："+b.textContent;results.textContent="";updateWeather()};
    results.appendChild(b);
   });
  }catch(_){results.textContent="暂时查不到，稍后再试"}
 };
}
let reconnects=0;function connect(){let p=location.protocol==="https:"?"wss":"ws",ws=new WebSocket(p+"://"+location.host+"/ws");ws.onopen=()=>{reconnects=0;$("conn").textContent="在线"};ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(_){}};ws.onclose=async()=>{reconnects++;if(reconnects>=2){try{let r=await fetch("/api/mobile/whoami",{cache:"no-store"});if(r.status===401){$("conn").textContent="登录失效";location.reload();return}}catch(_){}}$("conn").textContent="重连中";setTimeout(connect,Math.min(8000,1200*reconnects))};ws.onerror=()=>ws.close()}
applySize();applyCharacterAsset();updateClock();setInterval(updateClock,1000);updateWeather();setInterval(updateWeather,600000);connect();
